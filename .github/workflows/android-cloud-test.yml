name: Android Cloud Test
run-name: Android test from iPhone
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: Direct HTTPS URL of the APK to test
        required: true
        type: string
      package_name:
        description: Package name (optional)
        required: false
        type: string
permissions:
  contents: read
jobs:
  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          case "$APK_URL" in https://*) ;; *) echo "Only HTTPS APK URLs are allowed"; exit 1;; esac
          curl --fail --location --proto '=https' --tlsv1.2 "$APK_URL" -o app.apk
          test -s app.apk
      - name: Detect APK package
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          PACKAGE="${{ inputs.package_name }}"
          if [ -z "$PACKAGE" ]; then
            PACKAGE=$("$BUILD_TOOLS/aapt" dump badging app.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
          fi
          test -n "$PACKAGE"
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
          echo "Package: $PACKAGE"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Pixel 7
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            mkdir -p test-results
            adb install -r app.apk
            echo "$PACKAGE" > test-results/package.txt
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 10
            adb exec-out screencap -p > test-results/screenshot.png
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml test-results/window.xml || true
            adb shell dumpsys window > test-results/window.txt || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
